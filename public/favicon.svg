<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Rounded rect background with dark color matching midnight theme -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="#030712" />
  
  <!-- Outer border gradient frame -->
  <rect x="6" y="6" width="88" height="88" rx="20" stroke="url(#logo-grad)" stroke-width="4.5" fill="none" />
  
  <!-- Geometric "M" -->
  <path d="M 26 70 L 26 30 L 44 48 L 54 30 L 54 70" stroke="url(#logo-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Geometric "L" -->
  <path d="M 68 30 L 68 70 L 84 70" stroke="url(#logo-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
</svg>